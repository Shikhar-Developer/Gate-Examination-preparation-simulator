version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: gate_postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: gate_exam_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: gate_backend
    restart: always
    environment:
      POSTGRES_SERVER: db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: gate_exam_db
      POSTGRES_PORT: 5432
      SECRET_KEY: gate-secret-key-production-ready
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  postgres_data:
